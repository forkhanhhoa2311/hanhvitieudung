<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập Hành vi người tiêu dùng</title>
<style>
:root{--bg:#f6f7fb;--fg:#1c2033;--mut:#5d647a;--card:#fff;--bd:#dfe3ee;--ac:#4c5fd5;--acfg:#fff;--ok:#157347;--okbg:#e4f5ea;--bad:#b42318;--badbg:#fdeceb;--sh:0 1px 3px rgba(20,25,50,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--fg:#e8eaf3;--mut:#9aa1b8;--card:#1b1e2a;--bd:#2d3243;--ac:#7c8cff;--acfg:#10131f;--ok:#5fd38d;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1d1b;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--fg:#e8eaf3;--mut:#9aa1b8;--card:#1b1e2a;--bd:#2d3243;--ac:#7c8cff;--acfg:#10131f;--ok:#5fd38d;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1d1b;--sh:none;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#app{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;line-height:1.25;margin:8px 0 4px}
h2{font-size:1.05rem;margin:0 0 12px}
.sub,.hint{color:var(--mut);margin:0 0 16px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{border:1px solid var(--bd);background:transparent;border-radius:999px;padding:6px 14px}
.chip.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.link{background:none;border:0;color:var(--ac);padding:4px 8px 4px 0;font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row label{display:flex;gap:8px;align-items:center}
select,input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;max-width:100%}
input[type=text]{width:100%}
.btn{background:var(--ac);color:var(--acfg);border:0;border-radius:10px;padding:12px 20px;font-weight:600}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.bar{height:6px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--ac)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--mut)}
.q{font-size:1.08rem;font-weight:600;margin:6px 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--ac)}
.opt.ok,.st.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad,.st.bad{border-color:var(--bad);background:var(--badbg)}
.st{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.st p{margin:0 0 8px}
.seg{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg label{border:1px solid var(--bd);border-radius:8px;padding:4px 14px;cursor:pointer}
.seg label:has(input:checked){background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:center;margin-bottom:10px}
.mt.ok{color:var(--ok)}.mt.bad{color:var(--bad)}
@media (max-width:520px){.mt{grid-template-columns:1fr}}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.95rem}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.fb span{color:var(--fg)}
.score{font-size:2.6rem;font-weight:700;margin:4px 0}
.wr{border-top:1px solid var(--bd);padding:12px 0}
.wr p{margin:0 0 4px}.wr small{color:var(--mut)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D=[{"ch":"BÀI 1","t":"mc","q":"Trong nghiên cứu hành vi người tiêu dùng thì “Người tiêu dùng” bao gồm những đối tượng nào?","o":[{"t":"Chỉ những cá nhân trực tiếp sử dụng sản phẩm.","c":false},{"t":"Cá nhân hoặc nhóm người có nhu cầu và tham gia vào quá trình lựa chọn, mua sắm.","c":true},{"t":"Những cá nhân có liên quan đến quá trình ra quyết định mua hàng.","c":true},{"t":"Chỉ các tổ chức đại diện cho tập thể mua sắm.","c":false}]},{"ch":"BÀI 1","t":"mc","q":"Hành vì người tiêu dùng (Consumer Behavior) nghiên cứu các hoạt động nào của cá nhân, nhóm hoặc tổ chức?","o":[{"t":"Việc đánh giá và loại bỏ sản phẩm, dịch vụ nhằm thỏa mãn nhu cầu.","c":true},{"t":"Quá trình sản xuất và phân phối hàng hóa của doanh nghiệp.","c":false},{"t":"Cách thức lựa chọn, mua sắm và sử dụng sản phẩm.","c":true},{"t":"Việc thiết lập giá thành sản phẩm trên thị trường.","c":false}]},{"ch":"BÀI 1","t":"tf","q":"Xác định nhận định sau về bản chất của hành vi người tiêu dùng là đúng/sai:","st":[{"t":"Hành vi chỉ bao gồm các hành động quan sát được như tìm kiếm thông tin.","a":false},{"t":"Hành vi người tiêu dùng là một quá trình liên tục, không kết thúc sau khi mua hàng.","a":true},{"t":"Các yếu tố tâm lý như động cơ và niềm tin cũng thuộc phạm vi nghiên cứu hành vi.","a":true},{"t":"Mục tiêu cuối cùng là mang lại lợi nhuận cao nhất cho người bán.","a":false}]},{"ch":"BÀI 1","t":"tf","q":"Xác định nhận định sau về giai đoạn “Trước mua” là đúng/sai:","st":[{"t":"Tìm kiếm thông tin chỉ được thực hiện từ nguồn quảng cáo của doanh nghiệp.","a":false},{"t":"Người tiêu dùng sử dụng thông tin để so sánh các phương án dựa trên giá cả, chất lượng.","a":true},{"t":"Đây là giai đoạn người tiêu dùng nhận thức được nhu cầu hoặc vấn đề.","a":true},{"t":"Việc xem review trên YouTube thuộc giai đoạn “Trong mua”.","a":false}]},{"ch":"BÀI 1","t":"tf","q":"Xác định nhận định sau về các hoạt động trong quá trình mua sắm là đúng/sai:","st":[{"t":"Việc lựa chọn phương thức thanh toán là một hoạt động trong giai đoạn “Trong mua”.","a":true},{"t":"Hành vì người tiêu dùng chỉ chịu ảnh hưởng duy nhất bởi nhu cầu cá nhân.","a":false},{"t":"Quyết định mua hàng không bị tác động bởi các yếu tố tình huống tại điểm bán.","a":false},{"t":"Động cơ tiêu dùng là một phần của hành vi suy nghĩ bên trong.","a":true}]},{"ch":"BÀI 1","t":"mc","q":"Một sinh viên sử dụng máy tính để học tập, phụ huynh thanh toán tiền mua và cả hai cùng thảo luận lựa chọn sản phẩm. Những nhận định nào sau đây là đúng?","o":[{"t":"Không có người ra quyết định mua.","c":false},{"t":"Sinh viên là người sử dụng sản phẩm.","c":true},{"t":"Sinh viên đồng thời là người mua sản phẩm.","c":false},{"t":"Phụ huynh là người mua sản phẩm.","c":true}]},{"ch":"BÀI 1","t":"fill","q":"Điền từ thích hợp vào chỗ trống: Trong ví dụ một gia đình mua tivi, con cái muốn xem phim là _____","a":"người đề xuất"},{"ch":"BÀI 1","t":"mc","q":"Nghiên cứu hành vi người tiêu dùng giúp doanh nghiệp thực hiện các hoạt động nào trong chiến lược Marketing?","o":[{"t":"Tăng lương cho nhân viên sản xuất.","c":false},{"t":"Quản lý nguồn vốn vay dài hạn.","c":false},{"t":"Phân đoạn thị trường.","c":true},{"t":"Định vị thương hiệu.","c":true}]},{"ch":"BÀI 1","t":"tf","q":"Xác định những nhận định sau về vai trò của phân tích hành vi khách hàng trong chăm sóc khách hàng là đúng/ sai:","st":[{"t":"Thu hút khách hàng mới quan trọng hơn việc duy trì khách hàng hiện tại.","a":false},{"t":"Việc xử lý khiếu nại kịp thời không ảnh hưởng đến hình ảnh thương hiệu.","a":false},{"t":"Hiểu hành vi sau mua giúp cá nhân hóa các chương trình chăm sóc.","a":true},{"t":"Starbucks sử dụng dữ liệu thói quen để gửi ưu đãi riêng cho từng khách.","a":true}]},{"ch":"BÀI 1","t":"mc","q":"Việc nghiên cứu hành vi người tiêu dùng hỗ trợ doanh nghiệp phân đoạn thị trường vì:","o":[{"t":"Giúp doanh nghiệp bán cùng một sản phẩm cho tất cả khách hàng.","c":false},{"t":"Giúp doanh nghiệp loại bỏ hoàn toàn đối thủ cạnh tranh.","c":false},{"t":"Giúp doanh nghiệp tập trung nguồn lực vào những nhóm khách hàng tiềm năng.","c":true},{"t":"Giúp nhận diện các nhóm khách hàng có nhu cầu và hành vi tương đồng.","c":true}]},{"ch":"BÀI 1","t":"mc","q":"Nghiên cứu hành vi người tiêu dùng có vai trò quan trọng trong chăm sóc khách hàng vì:","o":[{"t":"Giúp khách hàng luôn trung thành mà không cần nâng cao chất lượng dịch vụ.","c":false},{"t":"Giúp xây dựng các chương trình chăm sóc và khách hàng thân thiết phù hợp.","c":true},{"t":"Giúp doanh nghiệp không cấn tiếp nhận phản hồi của khách hàng trực tiếp.","c":false},{"t":"Giúp doanh nghiệp hiểu mức độ hài lòng và trải nghiệm sau mua của khách hàng.","c":true}]},{"ch":"BÀI 1","t":"tf","q":"Xác định những nhận định sau về sự cần thiết của việc nghiên cứu hành vi là đúng/sai:","st":[{"t":"Không cần thiết nếu sản phẩm của doanh nghiệp đã có chất lượng tốt nhất.","a":false},{"t":"Giúp doanh nghiệp tồn tại trong môi trường cạnh tranh khốc liệt.","a":true},{"t":"Giúp dự đoán các xu hướng tiêu dùng mới như “tiêu dùng xanh”.","a":true},{"t":"Chỉ có các doanh nghiệp lớn mới cần nghiên cứu hành vi.","a":false}]},{"ch":"BÀI 1","t":"tf","q":"Xác định những nhận định sau về yếu tố văn hóa địa phương trong nghiên cứu là đúng/sai:","st":[{"t":"Ở Việt Nam, lễ Tết là dịp mua sắm quà biếu quan trọng do truyền thống gia đình.","a":true},{"t":"Văn hóa không ảnh hưởng đến thói quen tiêu dùng.","a":false},{"t":"Sử dụng hình ảnh thiếu tôn trọng truyền thống có thể dẫn đến bị tẩy chay.","a":true},{"t":"Thương hiệu quốc tế có thể thất bại nếu không nghiên cứu kỹ văn hóa địa phương.","a":true}]},{"ch":"BÀI 1","t":"tf","q":"Xác định những nhận định sau về lợi ích của nghiên cứu hành vi là đúng/sai:","st":[{"t":"Chỉ giúp ích cho việc bán hàng ngắn hạn.","a":false},{"t":"Giúp xây dựng lợi thế cạnh tranh bền vững.","a":true},{"t":"Là cơ sở để đổi mới và phát triển các sản phẩm phù hợp xu hướng.","a":true},{"t":"Giúp tăng tỷ lệ chuyển đổi từ khách hàng tiềm năng thành thực tế.","a":true}]},{"ch":"BÀI 1","t":"fill","q":"Nghiên cứu hành vi giúp doanh nghiệp đánh giá nhu cầu thị trường trước khi ra mắt để giảm thiểu _____ đầu tư.","a":"rủi ro"},{"ch":"BÀI 1","t":"tf","q":"Xác định nhận định về khái niệm các vai trò trong tiêu dùng là đúng/sai:","st":[{"t":"Người ra quyết định là người có ảnh hưởng lớn nhất đến việc chọn thương hiệu.","a":true},{"t":"Một người có thể đảm nhận nhiều vai trò cùng lúc.","a":true},{"t":"Bác sĩ khuyên dùng sữa cho trẻ em là ví dụ về người mua.","a":false},{"t":"Người sử dụng và người mua luôn luôn là cùng một đối tượng.","a":false}]},{"ch":"BÀI 1","t":"tf","q":"Xác định nhận định sau về giai đoạn “Sau mua” là đúng/sai:","st":[{"t":"Khách hàng không bao giờ chia sẻ đánh giá nếu họ cảm thấy không hài lòng.","a":false},{"t":"Trải nghiệm sử dụng sẽ quyết định mức độ hài lòng của khách hàng.","a":true},{"t":"Sự hài lòng sau mua dẫn đến ý định mua lại và lòng trung thành.","a":true},{"t":"Doanh nghiệp không cần quan tâm đến khách hàng sau khi đã thu được tiền.","a":false}]},{"ch":"BÀI 1","t":"tf","q":"Xác định những nhận định sau về vai trò của phân tích hành vi khách hàng đối với chiến lược Marketing là đúng/sai:","st":[{"t":"Định vị thương hiệu không cần dựa trên mong đợi của khách hàng.","a":false},{"t":"Hiểu hành vì giúp doanh nghiệp tối ưu hóa chi phí kinh doanh.","a":true},{"t":"Phân đoạn thị trường giúp doanh nghiệp tập trung nguồn lực vào nhóm khách hàng tiềm năng.","a":true},{"t":"Một thương hiệu chỉ có thể định vị theo một cách duy nhất cho mọi khách hàng.","a":false}]},{"ch":"BÀI 1","t":"tf","q":"Xác định những nhận định sau về lợi thế cạnh tranh là đúng/sai:","st":[{"t":"Khả năng dự đoán xu hướng giúp nắm bắt cơ hội trước đối thủ.","a":true},{"t":"Sự khác biệt hóa sản phẩm thường xuất phát từ việc thấu hiểu nhu cầu mới.","a":true},{"t":"Doanh nghiệp hiếu khách hàng tốt hơn đối thủ sẽ có khả năng thắng cao hơn.","a":true},{"t":"Cạnh tranh trong kinh doanh hiện đại chỉ là cạnh tranh về giá.","a":false}]},{"ch":"BÀI 1","t":"mc","q":"Doanh nghiệp có thể tối ưu hóa chi phí marketing khi nghiên cứu hành vi người tiêu dùng vì:","o":[{"t":"Có thể xác định đúng khách hàng mục tiêu và kênh truyền thông phù hợp.","c":true},{"t":"Có thể tiếp cận mọi khách hàng với cùng một thông điệp.","c":false},{"t":"Không cần thực hiện bất kỳ hoạt động quảng cáo nào.","c":false},{"t":"Không cần phân tích hiệu quả chiến dịch marketing.","c":false}]},{"ch":"BÀI 1","t":"mc","q":"Theo khái niệm hành vi người tiêu dùng, những hoạt động nào sau đây thuộc phạm vi nghiên cứu của hành vi người tiêu dùng?","o":[{"t":"Tìm kiếm thông tin về sản phẩm trước khi mua.","c":true},{"t":"Đánh giá mức độ hài lòng sau khi sử dụng sản phẩm.","c":true},{"t":"Quản lý nhân sự của doanh nghiệp.","c":false},{"t":"Sản xuất sản phẩm trong doanh nghiệp.","c":false}]},{"ch":"BÀI 1","t":"mc","q":"Chương trình khách hàng thân thiết (Loyalty Program) là ứng dụng của nghiên cứu hành vi trong:","o":[{"t":"Chăm sóc khách hàng.","c":true},{"t":"Lựa chọn kênh phân phối.","c":false},{"t":"Định giá sản phẩm.","c":false},{"t":"Phân đoạn thị trường.","c":false}]},{"ch":"BÀI 1","t":"tf","q":"Xác định những nhận định sau về vai trò của phân tích hành vi khách hàng trong phát triển sản phẩm là đúng/sai:","st":[{"t":"Doanh nghiệp cải tiến sản phẩm dựa trên phản hồi của khách hàng sau khi sử dụng.","a":true},{"t":"Nhu cầu của khách hàng là cố định và không bao giờ thay đổi.","a":false},{"t":"Nghiên cứu hành vi giúp giảm thiểu rủi ro khi đưa sản phẩm mới ra thị trường.","a":true},{"t":"Phát triển sản phẩm chỉ cần quan tâm đến tính năng kỹ thuật.","a":false}]},{"ch":"BÀI 1","t":"tf","q":"Xác định những nhận định sau về vai trò của phân tích hành vi khách hàng trong quảng cáo và truyền thông là đúng/sai:","st":[{"t":"Chiến dịch “Đi để trở về” của Biti’s thành công nhờ thấu hiểu tâm lý giới trẻ.","a":true},{"t":"Quảng cáo chỉ hiệu quả khi cung cấp đầy đủ thông tin lý trí về giá.","a":false},{"t":"Nghiên cứu hành vi không giúp đánh giá hiệu quả của quảng cáo.","a":false},{"t":"Doanh nghiệp cần lựa chọn o gồm ý định hành động.","a":false},{"t":"Thái độ được hình thành từ niềm tin của cá nhân về đối tượng.","a":true},{"t":"Thái độ thường có tính ổn định tương đối và khó thay đổi một sớm một chiều.","a":true}]},{"ch":"BÀI 4","t":"mc","q":"Một khách hàng tin rằng “sản phẩm có nhiều đánh giá tốt thì luôn chất lượng cao”. Niềm tin này ảnh hưởng đến: Hãy chọn 2 đáp án đúng nhất !","o":[{"t":"Cấu trúc logistics của doanh nghiệp","c":false},{"t":"Chi phí sản xuất sản phẩm","c":false},{"t":"Xu hướng hành vi mua hàng","c":true},{"t":"Thái độ tích cực đối với sản phẩm","c":true}]},{"ch":"BÀI 4","t":"mc","q":"Động cơ tiêu dùng được hiểu là gì?","o":[{"t":"Là trạng thái thiếu hụt vật chất mà con người cảm thấy.","c":false},{"t":"Là lực lượng thúc đẩy bên trong khiến cá nhân hành động nhằm thỏa mãn nhu cầu chưa được đáp ứng.","c":true},{"t":"Là điểm khởi đầu của mọi hành vi tiêu dùng.","c":false},{"t":"Là kết quả cuối cùng sau khi đã sử dụng sản phẩm.","c":false}]},{"ch":"BÀI 4","t":"mc","q":"Trong TMĐT, nhu cầu an toàn được thể hiện qua việc khách hàng quan tâm đến yếu tố nào?","o":[{"t":"Bảo mật thông tin thanh toán và đánh giá từ khách hàng trước đó.","c":true},{"t":"Việc kết nối với các hội nhóm trên mạng xã hội.","c":false},{"t":"Uy tín của sàn thương mại điện tử và chính sách đổi trả.","c":true},{"t":"Việc thể hiện phong cách cá nhân qua món hàng.","c":false}]},{"ch":"BÀI 4","t":"mc","q":"Theo Herzberg, nhóm yếu tố duy trì (Hygiene Factors) có đặc điểm gì?","o":[{"t":"Luôn tạo ra lợi thế cạnh tranh bền vững cho doanh nghiệp.","c":false},{"t":"Chỉ bao gồm các chương trình quảng cáo cá nhân hóa.","c":false},{"t":"Là những yếu tố “bắt buộc phải có”, nếu thiếu khách hàng sẽ cảm thấy không hài lòng.","c":true},{"t":"Khi được đáp ứng đầy đủ sẽ tạo ra sự hài lòng vượt mong đợi.","c":false}]},{"ch":"BÀI 4","t":"mc","q":"Đâu là ví dụ về yếu tố tạo động lực (Motivator Factors) theo lý thuyết Herzberg trong mua sắm trực tuyến?","o":[{"t":"Quà tặng và ưu đãi cá nhân hóa.","c":true},{"t":"Giao hàng đúng thời gian cam kết.","c":false},{"t":"Giá cả sản phẩm hợp lý.","c":false},{"t":"Dịch vụ chăm sóc khách hàng vượt mong đợi.","c":true}]},{"ch":"BÀI 4","t":"mc","q":"Một người tiêu dùng xem cùng một quảng cáo nhưng cho rằng sản phẩm “rẻ nhưng kém chất lượng”, trong khi người khác lại cho rằng “giá tốt, đáng mua”. Hiện tượng này phản ánh:","o":[{"t":"Tính chọn lọc thông tin.","c":false},{"t":"Hành vi mua theo cảm xúc.","c":false},{"t":"Tính diễn giải trong nhận thức.","c":true},{"t":"Hiệu ứng lan truyền xã hội.","c":false}]},{"ch":"BÀI 4","t":"mc","q":"Vì sao hai người có thể đánh giá khác nhau về cùng một sản phẩm?","o":[{"t":"Do giá sản phẩm thay đổi liên tục theo người dùng.","c":false},{"t":"Do sản phẩm thay đổi chất lượng theo người xem.","c":false},{"t":"Do khác biệt trong kinh nghiệm, nhu cầu và niềm tin cá nhân.","c":true},{"t":"Do thuật toán không hiển thị giống nhau.","c":false}]},{"ch":"BÀI 4","t":"mc","q":"Học hỏi trong hành vi tiêu dùng có thể diễn ra qua:","o":[{"t":"Trải nghiệm sử dụng sản phẩm.","c":true},{"t":"Vị trí đặt banner quảng cáo.","c":false},{"t":"Quan sát người khác sử dụng sản phẩm.","c":true},{"t":"Màu sắc quảng cáo.","c":false}]},{"ch":"BÀI 4","t":"match","q":"Ghép đặc điểm thông tin với khả năng ghi nhớ.","pairs":[["Thông tin lặp lại nhiều lần","Giúp thương hiệu in sâu vào tâm trí qua thời gian."],["Thông tin gây ấn tượng mạnh","Được lưu giữ lâu hơn vì mang lại giá trị cảm xúc hoặc lợi ích."],["Thông tin liên quan nhu cầu","Dễ dàng được truy xuất khi có nhu cầu phát sinh đột ngột."]]},{"ch":"BÀI 4","t":"mc","q":"Doanh nghiệp TMĐT muốn tăng khả năng khách hàng ghi nhớ thương hiệu lâu dài. Hai yếu tố hiệu quả nhất là:","o":[{"t":"Tăng số lượng sản phẩm bán ra trong ngắn hạn.","c":false},{"t":"Tạo trải nghiệm mua sắm tích cực.","c":true},{"t":"Lặp lại quảng cáo và nhận diện thương hiệu nhất quán.","c":true},{"t":"Giảm giá liên tục để thu hút mua hàng.","c":false}]},{"ch":"BÀI 4","t":"mc","q":"Doanh nghiệp muốn xây dựng thái độ tích cực của khách hàng đối với thương hiệu trên sàn TMĐT. Hai yếu tố quan trọng nhất là:","o":[{"t":"Giảm giá sâu liên tục để thu hút đơn hàng.","c":false},{"t":"Tăng số lượng quảng cáo hiển thị.","c":false},{"t":"Cung cấp thông tin sản phẩm đầy đủ và minh bạch.","c":true},{"t":"Tạo trải nghiệm mua sắm thuận tiện và hài lòng.","c":true}]},{"ch":"BÀI 5","t":"mc","q":"Nhóm tham khảo (Reference Group) được định nghĩa như thế nào theo Kotler và Keller?","o":[{"t":"Là tập hợp các cá nhân có cùng sở thích mua sắm trực tuyến.","c":false},{"t":"Là nhóm người có cùng mức thu nhập và địa vị trong xã hội.","c":false},{"t":"Là nhóm có ảnh hưởng trực tiếp hoặc gián tiếp đến thái độ và hành vi của một cá nhân.","c":true},{"t":"Chỉ bao gồm những người thân thiết nhất như gia đình và bạn bè.","c":false}]},{"ch":"BÀI 5","t":"mc","q":"Những yếu tố nào được coi là “Bằng chứng xã hội” (Social Proof) trong thương mại điện tử?","o":[{"t":"Tên gọi của thương hiệu.","c":false},{"t":"Điểm đánh giá (ratings) và lượt bình luận của người mua trước.","c":true},{"t":"Giá niêm yết của sản phẩm.","c":false},{"t":"Số lượng sản phẩm đã bán.","c":true}]},{"ch":"BÀI 5","t":"mc","q":"Đối với loại sản phẩm nào thì vai trò của gia đình và nhóm tham khảo trở nên quan trọng hơn?","o":[{"t":"Các sản phẩm không có thương hiệu.","c":false},{"t":"Các sản phẩm tiêu dùng nhanh hàng ngày.","c":false},{"t":"Các sản phẩm có giá trị cao hoặc người mua ít kinh nghiệm sử dụng.","c":true},{"t":"Các sản phẩm đã quá quen thuộc với người tiêu dùng.","c":false}]},{"ch":"BÀI 5","t":"mc","q":"Khái niệm “Truyền miệng điện tử” bao gồm các hình thức nào?","o":[{"t":"Các bảng quảng cáo ngoài trời của các sàn thương mại điện tử.","c":false},{"t":"Chỉ bao gồm việc gọi điện thoại tư vấn sản phẩm.","c":false},{"t":"Các đánh giá sao, bình luận sản phẩm, video review và bài đăng trên mạng xã hội.","c":true},{"t":"Việc gửi email quảng cáo hàng loạt cho khách hàng.","c":false}]},{"ch":"BÀI 5","t":"tf","q":"Một sinh viên dự định mua laptop để học tập. Trước khi quyết định, sinh viên này tham khảo ý kiến của anh trai đã có kinh nghiệm sử dụng nhiều dòng máy và đọc thêm các đánh giá trong một nhóm công nghệ trên Facebook.","st":[{"t":"Anh trai của sinh viên đóng vai trò là nhóm tham khảo ảnh hưởng đến quyết định mua hàng.","a":true},{"t":"Việc tham gia nhóm công nghệ trên Facebook là một hình thức tham khảo ý kiến từ nhóm tham khảo trực tuyến.","a":true},{"t":"Quyết định mua hàng trong tình huống này chỉ chịu ảnh hưởng bởi nhu cầu cá nhân của sinh viên.","a":false}]},{"ch":"BÀI 5","t":"tf","q":"Xác định các nhận định sau về đặc điểm của văn hóa là Đúng hay Sai.","st":[{"t":"Thói quen tiết kiệm thường được cha mẹ truyền lại cho con cái qua các thế hệ.","a":true},{"t":"Văn hóa là yếu tố cố định, không bao giờ thay đổi theo thời gian.","a":false},{"t":"Xu hướng săn khuyến mãi trong các dịp 11/11 hay Black Friday đã trở thành một nét văn hóa tiêu dùng.","a":true},{"t":"Văn hóa là yếu tố bẩm sinh, con người sinh ra đã có sẵn các giá trị văn hóa.","a":false}]},{"ch":"BÀI 5","t":"match","q":"Ghép tầng lớp xã hội với đặc điểm tiêu dùng tương ứng.","pairs":[["Nhóm thu nhập cao","Ưu tiên chất lượng, uy tín thương hiệu và tính cá nhân hóa."],["Nhóm thu nhập thấp","Quan tâm nhiều đến giá thấp, chương trình giảm giá và sản phẩm thiết yếu."],["Nhóm thu nhập trung bình","Cân nhắc giữa chất lượng và giá cả, dành thời gian tìm kiếm thông tin."]]},{"ch":"BÀI 5","t":"tf","q":"Ảnh hưởng của tầng lớp xã hội trong TMĐT","st":[{"t":"Tất cả các tầng lớp xã hội đều có hành vi tìm kiếm thông tin giống hệt nhau trên mạng.","a":false},{"t":"Khách hàng thu nhập thấp thường quan tâm nhiều đến chi phí vận chuyển.","a":true},{"t":"Người có học vấn cao và thu nhập tốt thường dễ tiếp cận thanh toán điện tử hơn.","a":true},{"t":"Nhóm thu nhập cao coi trải nghiệm mua sắm quan trọng hơn giá cả.","a":true}]},{"ch":"BÀI 5","t":"mc","q":"Một sàn thương mại điện tử nhận thấy khách hàng ở Việt Nam vẫn ưu tiên thanh toán khi nhận hàng (COD) mặc dù đã có nhiều phương thức thanh toán điện tử hiện đại. Nguyên nhân nào giải thích hợp lý nhất hiện tượng này?","o":[{"t":"Người tiêu dùng Việt Nam không sử dụng Internet.","c":false},{"t":"Tầng lớp xã hội quyết định hoàn toàn phương thức thanh toán.","c":false},{"t":"Giá sản phẩm quá cao.","c":false},{"t":"Ảnh hưởng của thói quen và niềm tin hình thành từ văn hóa tiêu dùng.","c":true}]},{"ch":"BÀI 5","t":"mc","q":"Một thương hiệu mỹ phẩm quốc tế triển khai hai chiến dịch quảng cáo khác nhau: Một chiến dịch nhấn mạnh sự sang trọng dành cho khách hàng cao cấp và một chiến dịch tập trung vào giá cả hợp lý dành cho khách hàng thu nhập trung bình. Chiến lược này phản ánh:","o":[{"t":"Ảnh hưởng của tầng lớp xã hội đến hành vi tiêu dùng.","c":true},{"t":"Văn hóa không ảnh hưởng đến tiêu dùng.","c":false},{"t":"Hoạt động phân khúc thị trường theo đặc điểm khách hàng.","c":true},{"t":"Mọi khách hàng có cùng động cơ mua hàng.","c":false}]},{"ch":"BÀI 5","t":"tf","q":"Xác định các nhận định sau về chuẩn mực và giá trị xã hội là Đúng hay Sai.","st":[{"t":"Xu hướng tiêu dùng xanh phản ánh giá trị xã hội về bảo vệ môi trường.","a":true},{"t":"Chuẩn mực xã hội có thể thay đổi theo sự phát triển của công nghệ.","a":true},{"t":"Việc đọc đánh giá trước khi mua hàng trực tuyến hiện nay đã trở thành một chuẩn mực phổ biến.","a":true},{"t":"Giá trị xã hội là những quy tắc cụ thể buộc mọi người phải tuân thủ.","a":false}]},{"ch":"BÀI 5","t":"match","q":"Ghép các hiệu ứng tâm lý với biểu hiện thực tế.","pairs":[["Hiệu ứng đám đông","Tin tưởng sản phẩm có dòng chữ “Đã bán 50.000”."],["Hiệu ứng FOMO","Lo lắng bỏ lỡ đợt Flash Sale giới hạn thời gian."],["Bằng chứng xã hội (Social Proof)","Xu hướng làm theo hành động của người khác khi thiếu thông tin."]]},{"ch":"BÀI 5","t":"tf","q":"Xác định các nhận định sau về cách doanh nghiệp tạo dựng Social Proof là Đúng hay Sai.","st":[{"t":"Khuyến khích người mua đăng ảnh và video trải nghiệm thực tế.","a":true},{"t":"Hiển thị số lượng sản ph ,"c":false},{"t":"Chỉ hỏi ý kiến qua điện thoại truyền thống.","c":false}]},{"ch":"BÀI 6","t":"mc","q":"Một sàn thương mại điện tử nhận thấy khách hàng ở Việt Nam vẫn ưu tiên thanh toán khi nhận hàng (COD) mặc dù đã có nhiều phương thức thanh toán điện tử hiện đại. Nguyên nhân nào giải thích hợp lý nhất hiện tượng này?","o":[{"t":"Ảnh hưởng của thói quen và niềm tin hình thành từ văn hóa tiêu dùng.","c":true},{"t":"Tầng lớp xã hội quyết định hoàn toàn phương thức thanh toán.","c":false},{"t":"Người tiêu dùng Việt Nam không sử dụng Internet.","c":false},{"t":"Giá sản phẩm quá cao.","c":false}]},{"ch":"BÀI 6","t":"tf","q":"Các yếu tố ảnh hưởng đến giai đoạn đánh giá gồm:","st":[{"t":"Kinh nghiệm và kiến thức của bản thân người tiêu dùng.","a":true},{"t":"Ý kiến từ nhóm tham khảo, chẳng hạn gia đình, đồng nghiệp…","a":true},{"t":"Các yếu tố này hoàn toàn không thay đổi được thái độ của khách hàng.","a":false},{"t":"Các thông tin quảng cáo và truyền thông từ doanh nghiệp.","a":true}]},{"ch":"BÀI 6","t":"mc","q":"Chị Hoa dự định mua điện thoại X. Khi truy cập sàn TMĐT, chị thấy: Điện thoại X giảm giá 5%. Điện thoại Y giảm giá 20%. Điện thoại X đang trong Flash Sale còn 30 phút. Livestream của cửa hàng đang giới thiệu điện thoại Y với nhiều ưu đãi. Chị chuyển sang mua điện thoại Y. Hai yếu tố nào trực tiếp tác động đến quyết định cuối cùng?","o":[{"t":"Flash sale.","c":true},{"t":"Quá trình tìm kiếm thông tin mua hàng trước đó.","c":false},{"t":"Ý định mua điện thoại.","c":false},{"t":"Livestream bán hàng.","c":true}]},{"ch":"BÀI 6","t":"tf","q":"Trong TMĐT, quyết định mua dễ bị tác động bởi:","st":[{"t":"Các mã giảm giá có giới hạn thời gian.","a":true},{"t":"Các gợi ý sản phẩm từ hệ thống AI của sàn.","a":true},{"t":"Việc khách hàng không thể nói ý kiến bất kỳ.","a":false},{"t":"Livestream bán hàng mang tính tương tác cao.","a":true}]},{"ch":"BÀI 6","t":"fill","q":"Việc khuyến khích khách hàng để lại __________ và chia sẻ trải nghiệm tích cực là một chiến lược quan trọng để thu hút khách hàng mới.","a":"đánh giá tốt"},{"ch":"BÀI 7","t":"mc","q":"Nghiên cứu hành vi người tiêu dùng là quá trình nào sau đây?","o":[{"t":"Quá trình quảng cáo sản phẩm trên các nền tảng mạng xã hội.","c":false},{"t":"Chỉ đơn thuần là việc bán hàng cho khách hàng hiện tại.","c":false},{"t":"Quá trình thu thập, xử lý và phân tích thông tin về nhu cầu, động cơ, thái độ và hành vi mua sắm để hỗ trợ quyết định marketing.","c":true},{"t":"Quá trình sản xuất hàng hóa dựa trên các nguồn lực có sẵn của doanh nghiệp.","c":false}]},{"ch":"BÀI 7","t":"mc","q":"Bảng câu hỏi khảo sát đóng vai trò gì trong nghiên cứu định lượng?","o":[{"t":"Chỉ dùng để ghi chép lại các cuộc trò chuyện ngẫu hứng.","c":false},{"t":"Giúp thay đổi thái độ của khách hàng ngay lập tức khi họ đang trả lời.","c":false},{"t":"Là công cụ thu thập dữ liệu sơ cấp một cách có hệ thống và giúp chuẩn hóa thông tin.","c":true},{"t":"Là cầu nối giúp chuyển đổi thông tin thực tế thành dữ liệu có thể phân tích bằng thống kê.","c":true}]},{"ch":"BÀI 7","t":"mc","q":"Khi so sánh hai phương pháp nghiên cứu, tiêu chí nào sau đây là đúng?","o":[{"t":"Nghiên cứu định tính nhằm khám phá vấn đề, trong khi định lượng nhằm đo lường và kiểm định vấn đề.","c":true},{"t":"Cả hai phương pháp đều sử dụng chung một loại công cụ phân tích là thống kê mô tả.","c":false},{"t":"Nghiên cứu định tính luôn rẻ hơn và nhanh hơn nghiên cứu định lượng trong mọi trường hợp.","c":false},{"t":"Cỡ mẫu của nghiên cứu định tính thường nhỏ, còn định lượng thường lớn.","c":true}]},{"ch":"BÀI 7","t":"mc","q":"Một doanh nghiệp vừa hoàn thành khảo sát khách hàng qua Google Forms. Trước khi tiến hành phân tích dữ liệu, nhóm nghiên cứu cần kiểm tra các phiếu khảo sát. Việc kiểm tra dữ liệu nhằm mục đích nào dưới đây?","o":[{"t":"Thay đổi nội dung các câu trả lời của người tham gia khảo sát.","c":false},{"t":"Tăng số lượng phiếu khảo sát để kết quả chính xác hơn.","c":false},{"t":"Loại bỏ các câu trả lời không hợp lệ.","c":true},{"t":"Đảm bảo d "c":false},{"t":"Chuyển câu hỏi thành dạng trung lập để tránh dẫn dắt người trả lời.","c":true}]},{"ch":"BÀI 7","t":"mc","q":"Một doanh nghiệp muốn khảo sát hành vi mua sắm trực tuyến của sinh viên nhưng bảng hỏi gồm hơn 80 câu, trong đó nhiều câu hỏi không liên quan đến mục tiêu nghiên cứu. Để nâng cao chất lượng bảng khảo sát, nhóm nghiên cứu nên làm gì?","o":[{"t":"Bổ sung thêm nhiều câu hỏi về sở thích cá nhân để có thêm dữ liệu.","c":false},{"t":"Chỉ giữ lại các câu hỏi cần thiết để giảm thời gian trả lời.","c":true},{"t":"Giữ nguyên vì càng nhiều câu hỏi thì dữ liệu càng chính xác.","c":false},{"t":"Loại bỏ các câu hỏi không phục vụ mục tiêu nghiên cứu.","c":true}]},{"ch":"BÀI 7","t":"mc","q":"Một nhóm nghiên cứu vừa hoàn thành bảng khảo sát và dự định phát ngay cho 1.000 người. Theo quy trình xây dựng bảng khảo sát, trước khi triển khai chính thức nên thực hiện điều gì?","o":[{"t":"Chỉ rà soát lỗi chính tả và hình thức trình bày trước khi phát hành chính thức.","c":false},{"t":"Khảo sát thử bảng hỏi trên một nhóm nhỏ để phát hiện những vấn đề có thể xảy ra.","c":true},{"t":"Tăng số lượng người tham gia khảo sát để bù lại những sai sót có thể có trong bảng hỏi.","c":false},{"t":"Điều chỉnh hoặc bổ sung câu hỏi nếu kết quả khảo sát thử cho thấy còn điểm chưa phù hợp.","c":true}]},{"ch":"BÀI 7","t":"match","q":"Ghép loại câu hỏi với ví dụ tương ứng:","pairs":[["Câu hỏi đóng","Bạn có sử dụng ví điện tử không? (Có / Không)"],["Câu hỏi thang đo","Bạn đánh giá như thế nào về độ bền của sản phẩm này trên thang từ 1 đến 5?"],["Câu hỏi mở","Lý do quan trọng nhất khiến bạn chọn mua hàng tại shop này là gì?"]]},{"ch":"BÀI 7","t":"tf","q":"Xác định những nhận định sau là đúng/sai về các nguyên tắc thiết kế bảng câu hỏi bao gồm:","st":[{"t":"Mỗi câu hỏi phải phục vụ trực tiếp cho mục tiêu nghiên cứu đã xác định.","a":true},{"t":"Các câu hỏi nên được sắp xếp từ khó đến dễ để thử thách người trả lời ngay từ đầu.","a":false},{"t":"Câu hỏi nên bắt đầu từ những thông tin chuyên ","c":false},{"t":"Quan sát bí mật hành vi của khách hàng.","c":false},{"t":"Thảo luận nhóm tập trung.","c":false},{"t":"Khảo sát bằng bảng hỏi (trực tiếp hoặc trực tuyến).","c":true}]},{"ch":"BÀI 7","t":"mc","q":"Dựa trên đặc điểm của các phương pháp nghiên cứu, hãy nêu: Định hướng phương pháp định lượng để thu thập dữ liệu từ số lượng lớn người tham gia.","o":[{"t":"Quan sát hành vi hành vi của khách hàng.","c":false},{"t":"Khảo sát bằng bảng hỏi trực tuyến hoặc thư truyền.","c":true},{"t":"Thảo luận nhóm tập trung.","c":false},{"t":"Phỏng vấn sâu từng cá nhân.","c":false}]},{"ch":"BÀI 7","t":"tf","q":"Xác định Đúng/Sai về các phương pháp phỏng vấn sâu:","st":[{"t":"Phỏng vấn sâu mục đích đảm bảo chất lượng, đặc biệt là khám phá các yếu tố mới từ đáp viên.","a":false},{"t":"Phương pháp điều tra bằng câu hỏi giúp đảm bảo thu thập thông tin đa dạng giống như là đáp ứng.","a":true},{"t":"Phỏng vấn mạng xã hội chuyển đổi một không có câu hỏi định trước, hoàn toàn ngẫu hứng.","a":false},{"t":"Phỏng vấn bán chuẩn hóa, cấu trúc mở thường tốn nhiều thời gian hơn so với phỏng vấn nhóm.","a":true}]},{"ch":"BÀI 8","t":"mc","q":"Những yếu tố nào sau đây đã làm thay đổi cách thức người dùng tìm kiếm thông tin và thực hiện giao dịch?","o":[{"t":"Việc giảm bớt các hạ tầng viễn thông tại địa phương.","c":false},{"t":"Sự phổ biến của mạng xã hội và các nền tảng thương mại điện tử.","c":true},{"t":"Sự gia tăng của các cửa hàng tạp hóa truyền thống.","c":false},{"t":"Sự phát triển của Internet và điện thoại thông minh.","c":true}]},{"ch":"BÀI 8","t":"mc","q":"Nguồn thông tin nào người tiêu dùng thường sử dụng để tìm kiếm trước khi mua hàng?","o":[{"t":"Chỉ tin vào các tờ rơi quảng cáo được phát tại cửa hàng.","c":false},{"t":"Chờ đợi nhân viên bán hàng gọi điện tư vấn trực tiếp.","c":false},{"t":"Tìm kiếm thông tin trên Google và xem video đánh giá trên YouTube.","c":true},{"t":"Tham khảo ý kiến trên Facebook, TikTok hoặc các sàn TMĐT.","c":true}]},{"ch":"BÀI 8","t":"mc","q":"Trong giai đoạn “Trung thành và lan tỏa”, khách hàng thường có biểu hiện nào?","o":[{"t":"Tìm kiếm thông tin về đối thủ cạnh tranh để so sánh lại từ đầu.","c":false},{"t":"Tiếp tục mua hàng nhiều lần và tham gia chương trình khách hàng thân thiết.","c":true},{"t":"Ngay lập tức xóa ứng dụng mua sắm sau khi nhận hàng.","c":false},{"t":"Đóng vai trò như “đại sứ thương hiệu” để giới thiệu sản phẩm cho người khác.","c":true}]},{"ch":"BÀI 8","t":"mc","q":"Xu hướng “Tiêu dùng cá nhân hóa” được hỗ trợ chủ yếu bởi công nghệ nào?","o":[{"t":"Trí tuệ nhân tạo (AI) và dữ liệu lớn (Big Data).","c":true},{"t":"Kỹ thuật in ấn truyền thống trên bao bì.","c":false},{"t":"Việc cắt giảm toàn bộ đội ngũ chăm sóc khách hàng.","c":false},{"t":"Các phương thức giao hàng bằng xe máy thông thường.","c":false}]},{"ch":"BÀI 8","t":"tf","q":"Xác định các nhận định sau là Đúng hay Sai:","st":[{"t":"Tiêu dùng cá nhân hóa hướng đến việc cung cấp sản phẩm, nội dung quảng cáo và chương trình ưu đãi phù hợp với từng nhóm khách hàng.","a":true},{"t":"Trí tuệ nhân tạo (AI) và dữ liệu lớn (Big Data) hỗ trợ doanh nghiệp thu thập, phân tích dữ liệu khách hàng để triển khai marketing cá nhân hóa.","a":true},{"t":"Livestream bán hàng giúp tăng tính tương tác giữa người bán và khách hàng, đồng thời cho phép giải đáp thắc mắc ngay trong quá trình phát sóng.","a":true},{"t":"Mua sắm đa kênh là việc doanh nghiệp chỉ tập trung bán hàng trên sàn thương mại điện tử để tối ưu doanh thu.","a":false}]},{"ch":"BÀI 8","t":"tf","q":"Xác định các nhận định sau là Đúng hay Sai:","st":[{"t":"UX kém là một trong những nguyên nhân chính dẫn đến tình trạng bỏ giỏ hàng.","a":true},{"t":"UX là tổng thể cảm nhận, cảm xúc của người dùng khi tương tác với nền tảng số.","a":true},{"t":"Một UX tốt chỉ cần giao diện đẹp, không cần quan tâm đến tốc độ xử lý.","a":false},{"t":"UX tốt giúp khách hàng thực hiện giao dịch dễ dàng và tăng ý định quay lại.","a":true}]},{"ch":"BÀI 8","t":"match","q":"Ghép các thành phần của UX","pairs":[["Thiết kế giao diện","Giao diện trực quan, thẩm mỹ và nhất quán."],["Tính hữu ích","Hệ thống đáp ứng đúng nhu cầu và mục tiêu của người dùng."],["Hiệu suất","Hệ thống phản hồi nhanh chóng và ổn định."],["Tính dễ sử dụng","Người dùng có thể thao tác hệ thống một cách thuận tiện."]]},{"ch":"BÀI 8","t":"fill","q":"Website hoặc ứng dụng có ................................ chậm có thể làm giảm trải nghiệm người dùng và khiến khách hàng từ bỏ việc mua sắm ngay lập tức.","a":"Tốc độ tải trang"},{"ch":"BÀI 8","t":"mc","q":"Một website thương mại điện tử nhận được nhiều phản hồi rằng khách hàng mất nhiều thời gian mới tìm được sản phẩm cần mua vì danh mục sắp xếp chưa hợp lý và công cụ tìm kiếm hoạt động kém hiệu quả. Để cải thiện UX, doanh nghiệp nên ưu tiên giải pháp nào?","o":[{"t":"Nâng cao tính dễ sử dụng bằng cách tối ưu chức năng tìm kiếm và điều hướng.","c":true},{"t":"Tăng số lượng sản phẩm hiển thị trên mỗi trang để khách hàng có nhiều lựa chọn hơn.","c":false},{"t":"Bổ sung thêm nhiều banner quảng cáo trên trang chủ để khách hàng chú ý đến sản phẩm.","c":false},{"t":"Thiết kế lại cấu trúc website để khách hàng dễ tìm kiếm sản phẩm hơn.","c":true}]},{"ch":"BÀI 8","t":"mc","q":"Một cửa hàng trực tuyến nhận thấy phần lớn khách hàng quay lại mua hàng sau lần giao dịch đầu tiên đều đánh giá cao việc hệ thống tự động lưu thông tin giao hàng và gợi ý các sản phẩm phù hợp. Những yếu tố nào đang góp phần làm tăng tỷ lệ mua lại?","o":[{"t":"Khả năng cá nhân hóa nội dung và đề xuất sản phẩm phù hợp.","c":true},{"t":"Hệ thống ghi nhớ thông tin khách hàng giúp rút ngắn thời gian mua hàng.","c":true},{"t":"Tăng số lượng quảng cáo xuất hiện sau mỗi lần đăng nhập.","c":false},{"t":"Hiển thị toàn bộ sản phẩm trên trang chủ để khách hàng dễ lựa chọn.","c":false}]},{"ch":"BÀI 8","t":"tf","q":"Xác định các nhận định sau là Đúng hay Sai:","st":[{"t":"Hình ảnh và video thực tế do người dùng tự quay và đăng tải.","a":true},{"t":"Chỉ bao gồm các thông tin quảng cáo do chính doanh nghiệp viết ra. function mcView(q){
  const multi=q.o.filter(o=>o.c).length>1,name='o'+Math.random();
  const rows=q.o.map((o,i)=>{const inp=h('input',{type:multi?'checkbox':'radio',name});return{o,inp,lab:h('label',{class:'opt'},inp,h('span',{},o.t))}});
  return{el:[h('p',{class:'hint'},multi?'Chọn tất cả đáp án đúng':'Chọn 1 đáp án'),...rows.map(r=>r.lab)],
    grade(){let ok=true;rows.forEach(r=>{if(r.inp.checked!==r.o.c)ok=false;r.inp.disabled=true;r.lab.classList.toggle('ok',r.o.c);r.lab.classList.toggle('bad',r.inp.checked&&!r.o.c)});return ok}};
}
function tfView(q){
  const rows=q.st.map(s=>{const name='t'+Math.random();
    const mk=(v,t)=>{const inp=h('input',{type:'radio',name});return{v,inp,lab:h('label',{},inp,t)}};
    const a=mk(true,'Đúng'),b=mk(false,'Sai');
    return{s,a,b,box:h('div',{class:'st'},h('p',{},s.t),h('div',{class:'seg'},a.lab,b.lab))}});
  return{el:rows.map(r=>r.box),
    grade(){let ok=true;rows.forEach(r=>{const g=r.a.inp.checked?true:r.b.inp.checked?false:null;const right=g===r.s.a;if(!right)ok=false;r.a.inp.disabled=r.b.inp.disabled=true;r.box.classList.add(right?'ok':'bad');if(!right)r.box.append(h('small',{},'Đáp án đúng: '+(r.s.a?'Đúng':'Sai')))});return ok}};
}
function fillView(q){
  const inp=h('input',{type:'text',placeholder:'Nhập câu trả lời…',autocomplete:'off'});
  return{el:[inp],
    grade(){inp.disabled=true;const u=norm(inp.value),parts=q.a.split(/\s*\/\s*/);
      return u!==''&&(u===norm(q.a)||u===norm(parts.join(''))||parts.some(p=>norm(p)===u))}};
}
function matchView(q){
  const rights=shuffle(q.pairs.map(p=>p[1]));
  const rows=q.pairs.map(p=>{const s=h('select',{},h('option',{value:''},'— chọn —'),rights.map(r=>h('option',{value:r},r)));return{p,s,box:h('div',{class:'mt'},h('div',{},p[0]),s)}});
  return{el:[h('p',{class:'hint'},'Ghép mỗi mục với nội dung phù hợp'),...rows.map(r=>r.box)],
    grade(){let ok=true;rows.forEach(r=>{const right=r.s.value===r.p[1];if(!right)ok=false;r.s.disabled=true;r.box.classList.add(right?'ok':'bad');if(!right)r.box.append(h('small',{},'Đúng: '+r.p[1]))});return ok}};
}
const VIEW={mc:mcView,tf:tfView,fill:fillView,match:matchView};

function home(){
  const wrong=store.get('wrong',[]).filter(i=>D[i]);
  const start=()=>{let ids=D.map((q,i)=>i).filter(i=>sel.has(D[i].ch));if(shuf)ids=shuffle(ids);if(cnt!=='all')ids=ids.slice(0,+cnt);if(ids.length)run(ids)};
  app.replaceChildren(
    h('h1',{},'Ôn tập Hành vi người tiêu dùng'),
    h('p',{class:'sub'},D.length+' câu hỏi · trắc nghiệm, đúng/sai, điền từ, ghép đôi · có đáp án và chấm điểm ngay'),
    h('section',{class:'card'},h('h2',{},'Chọn bài ôn tập'),
      h('div',{class:'chips'},chs.map(c=>h('button',{class:'chip'+(sel.has(c)?' on':''),onclick:()=>{sel.has(c)?sel.delete(c):sel.add(c);home()}},cap(c)+' · '+D.filter(q=>q.ch===c).length))),
      h('div',{class:'row'},h('button',{class:'link',onclick:()=>{chs.forEach(c=>sel.add(c));home()}},'Chọn tất cả'),h('button',{class:'link',onclick:()=>{sel.clear();home()}},'Bỏ chọn'))),
    h('section',{class:'card'},h('h2',{},'Tuỳ chọn'),
      h('div',{class:'row'},
        h('label',{},'Số câu ',h('select',{onchange:e=>cnt=e.target.value},[['all','Tất cả'],['10','10 câu'],['20','20 câu'],['30','30 câu'],['50','50 câu']].map(([v,t])=>h('option',{value:v,selected:cnt===v},t)))),
        h('label',{},h('input',{type:'checkbox',checked:shuf,onchange:e=>shuf=e.target.checked}),'Trộn ngẫu nhiên'))),
    h('div',{class:'actions'},
      h('button',{class:'btn',disabled:!sel.size,onclick:start},'Bắt đầu ôn tập'),
      wrong.length?h('button',{class:'btn sec',onclick:()=>run(shuffle(wrong))},'Ôn lại câu sai ('+wrong.length+')'):null));
  window.scrollTo(0,0);
}

function run(ids){ses={ids,i:0,res:[]};ask()}
function ask(){
  const q=D[ses.ids[ses.i]],v=VIEW[q.t](q),n=ses.ids.length;
  const fb=h('div'),act=h('div',{class:'actions'});
  const check=h('button',{class:'btn',onclick:()=>{
    let ok=v.grade();
    const show=()=>{fb.replaceChildren(ok?h('div',{class:'fb ok'},h('b',{},'Chính xác!')):h('div',{class:'fb bad'},h('b',{},'Chưa đúng'),h('span',{},'Đáp án: '+answerText(q))))};
    show();
    ses.res[ses.i]={id:ses.ids[ses.i],ok};
    check.replaceWith(h('button',{class:'btn',onclick:next},ses.i+1<n?'Câu tiếp →':'Xem kết quả'));
    if(!ok&&q.t==='fill')act.append(h('button',{class:'btn sec',onclick:e=>{ok=true;ses.res[ses.i].ok=true;show();e.target.remove()}},'Tính là đúng'));
  }},'Kiểm tra');
  const next=()=>{ses.i++;ses.i<n?ask():finish()};
  act.append(check,h('button',{class:'link',onclick:()=>{if(confirm('Thoát phiên ôn tập này?'))home()}},'Thoát'));
  app.replaceChildren(
    h('div',{class:'meta'},h('span',{},'Câu '+(ses.i+1)+' / '+n),h('span',{},cap(q.ch)+' · '+TYPE[q.t])),
    h('div',{class:'bar'},h('i',{style:'width:'+(ses.i/n*100)+'%'})),
    h('section',{class:'card'},h('div',{class:'q'},q.q),v.el,fb,act));
  window.scrollTo(0,0);
}

function finish(){
  const res=ses.res,ok=res.filter(r=>r&&r.ok).length,n=ses.ids.length,bad=res.filter(r=>r&&!r.ok).map(r=>r.id);
  const wrong=new Set(store.get('wrong',[]));
  res.forEach(r=>{if(r)r.ok?wrong.delete(r.id):wrong.add(r.id)});
  store.set('wrong',[...wrong]);
  const pct=Math.round(ok/n*100);
  app.replaceChildren(
    h('section',{class:'card'},h('h2',{},'Kết quả'),h('div',{class:'score'},ok+' / '+n),
      h('p',{class:'sub'},pct+'% · '+(pct>=80?'Rất tốt, bạn nắm bài chắc rồi!':pct>=50?'Khá ổn, ôn lại các câu sai nhé.':'Cần ôn thêm, thử làm lại các câu sai.'))),
    h('div',{class:'actions'},
      bad.length?h('button',{class:'btn',onclick:()=>run(shuffle(bad))},'Làm lại câu sai ('+bad.length+')'):null,
      h('button',{class:'btn sec',onclick:home},'Về trang chủ')),
    bad.length?h('section',{class:'card',style:'margin-top:14px'},h('h2',{},'Các câu cần xem lại'),bad.map(id=>{const q=D[id];return h('div',{class:'wr'},h('p',{},q.q),h('small',{},'Đáp án: '+answerText(q)))})):null);
  window.scrollTo(0,0);
}
home();
</script>
